<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Placement Preparation Portal</title>
    <link rel="stylesheet" href="CSS/style.css">

    <style>
        body {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #030712 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.15);
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            font-size: 38px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        .form-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .form-input-wrapper label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .form-input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input-wrapper input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: #111827;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 36px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
        }

        .toggle-password:hover {
            color: #f8fafc;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #2563eb;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            transition: all 0.2s ease;
        }

        .google-btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #1f293d;
        }

        .auth-divider span {
            background: #111827;
            padding: 0 12px;
            color: #64748b;
            font-size: 12px;
            position: relative;
            text-transform: uppercase;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #94a3b8;
        }

        .auth-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .msg-success {
            color: #34d399;
        }

        .msg-error {
            color: #f87171;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-logo">🎓</span>
            <h1 class="auth-title">Student Login</h1>
            <p class="auth-subtitle">Sign in to access your company quizzes & placement analytics</p>
        </div>

        <form id="loginForm" onsubmit="handleStudentLogin(event)">
            <div class="form-input-wrapper">
                <label for="email">Student Email Address</label>
                <input type="email" id="email" placeholder="student@university.edu" required>
            </div>

            <div class="form-input-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="button" class="toggle-password" onclick="togglePass('password')">👁 Show</button>
            </div>

            <button type="submit" id="loginButton" class="btn-submit">
                🔐 Login to Portal
            </button>
        </form>

        <div class="auth-divider">
            <span>OR</span>
        </div>

        <button type="button" id="googleLoginBtn" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
        </button>

        <div id="message"></div>

        <div class="auth-footer">
            Don't have an account yet? <a href="register.html">Register here</a>
        </div>
    </div>

    <script>
        function togglePass(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        async function handleStudentLogin(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const loginButton = document.getElementById("loginButton");
            const messageEl = document.getElementById("message");

            messageEl.className = "";
            messageEl.innerText = "";
            loginButton.disabled = true;
            loginButton.innerText = "Authenticating...";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.className = "msg-success";
                    messageEl.innerText = "✅ Login successful! Redirecting...";

                    const userData = {
                        email: data.email || email,
                        name: data.name || email.split("@")[0]
                    };
                    localStorage.setItem("loggedInUser", JSON.stringify(userData));

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                } else {
                    messageEl.className = "msg-error";
                    messageEl.innerText = "❌ " + (data.error || "Invalid email or password.");
                    loginButton.disabled = false;
                    loginButton.innerText = "🔐 Login to Portal";
                }
            } catch (error) {
                console.error("Login error:", error);
                messageEl.className = "msg-error";
                messageEl.innerText = "❌ Connection error. Please try again.";
                loginButton.disabled = false;
                loginButton.innerText = "🔐 Login to Portal";
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        (async () => {
            try {
                const configRes = await fetch("/api/firebase-config");
                const config = await configRes.json();
                const app = initializeApp(config);
                const auth = getAuth(app);
                const provider = new GoogleAuthProvider();

                const googleBtn = document.getElementById("googleLoginBtn");
                if (googleBtn) {
                    googleBtn.addEventListener("click", async () => {
                        const messageEl = document.getElementById("message");
                        messageEl.className = "";
                        messageEl.innerText = "Connecting to Google...";

                        try {
                            const result = await signInWithPopup(auth, provider);
                            const user = result.user;
                            const userData = {
                                id: user.uid,
                                name: user.displayName || user.email.split("@")[0],
                                email: user.email
                            };

                            localStorage.setItem("loggedInUser", JSON.stringify(userData));

                            await fetch("/register", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    name: userData.name,
                                    email: userData.email,
                                    password: "google_oauth_" + user.uid.substring(0, 8)
                                })
                            }).catch(() => {});

                            messageEl.className = "msg-success";
                            messageEl.innerText = "Welcome, " + userData.name + "! Redirecting...";

                            setTimeout(() => {
                                window.location.href = "dashboard.html";
                            }, 800);
                        } catch (err) {
                            console.error("Google login failed:", err);
                            messageEl.className = "msg-error";
                            messageEl.innerText = "❌ " + (err.message || "Google Sign-In failed.");
                        }
                    });
                }
            } catch (e) {
                console.warn("Firebase client auth init warning:", e);
            }
        })();
    </script>

</body>

</html>
