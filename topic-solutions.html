<!DOCTYPE html>
<html>

<head>

    <title>Topic Questions & Solutions</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
            color: #1f2937;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #64748b;
        }

        .info-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .info-card h3 {
            margin: 10px 0;
            color: #1e3a8a;
        }

        .question-count {
            background: white;
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .question-count h3 {
            margin: 0;
            color: #2563eb;
        }

        .question-box {
            background: white;
            margin: 20px 0;
            padding: 25px;
            border: 1px solid #e1e5eb;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .question-box h3 {
            color: #1e3a8a;
            line-height: 1.5;
            margin-top: 0;
        }

        .option {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 8px;
            color: #374151;
        }

        .answer {
            margin-top: 20px;
            padding: 15px;
            background: #ecfdf5;
            border-left: 5px solid #16a34a;
            border-radius: 8px;
            color: #166534;
        }

        .explanation {
            margin-top: 12px;
            padding: 15px;
            background: #fffbeb;
            border-left: 5px solid #f59e0b;
            border-radius: 8px;
            color: #92400e;
            line-height: 1.6;
        }

        .ai-badge {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #2563eb;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .error-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .error-box h3 {
            color: #dc2626;
        }

        .button-area {
            text-align: center;
            margin: 30px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            margin: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 25px;
            }

            .container {
                padding: 0 12px;
            }

            .question-box,
            .info-card {
                padding: 20px;
            }

            button {
                width: 100%;
                margin: 6px 0;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>🎓 Placement Preparation Portal</h1>

</div>


<div class="container">


    <!-- PAGE TITLE -->

    <div class="page-title">

        <h2>✅ Topic Questions & Solutions</h2>

        <p>
            Review important questions, answers and explanations.
        </p>

    </div>


    <!-- INFORMATION -->

    <div class="info-card">

        <h3 id="companyTitle"></h3>

        <h3 id="roleTitle"></h3>

        <h3 id="topicTitle"></h3>

    </div>


    <!-- SOLUTIONS -->

    <div id="solutions">

        <div class="loading">
            🤖 Gemini is generating questions and solutions...
        </div>

    </div>


    <!-- BUTTONS -->

    <div class="button-area">

        <button onclick="goBack()">
            ← Back to Topic Preparation
        </button>

        <button onclick="goDashboard()">
            🏠 Dashboard
        </button>

    </div>


</div>


<script>
// ========================================
// LOGIN PROTECTION
// ========================================

const loggedInUser =
    localStorage.getItem("loggedInUser");

if (!loggedInUser) {
    window.location.href = "login.html";
}

// ========================================
// GET VALUES FROM URL
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const company =
    params.get("company") ||
    localStorage.getItem(
        "selectedCompany"
    ) ||
    "";


const role =
    params.get("role") ||
    localStorage.getItem(
        "selectedRole"
    ) ||
    "";


const topic =
    params.get("topic") ||
    localStorage.getItem(
        "selectedTopic"
    ) ||
    "";


// ========================================
// SAVE VALUES
// ========================================

localStorage.setItem(
    "selectedCompany",
    company
);

localStorage.setItem(
    "selectedRole",
    role
);

localStorage.setItem(
    "selectedTopic",
    topic
);


// ========================================
// DISPLAY COMPANY
// ========================================

document.getElementById(
    "companyTitle"
).innerText =
    "🏢 Company: " + company;


// ========================================
// DISPLAY ROLE
// ========================================

document.getElementById(
    "roleTitle"
).innerText =
    "💼 Role: " + role;


// ========================================
// DISPLAY TOPIC
// ========================================

document.getElementById(
    "topicTitle"
).innerText =
    "📚 Topic: " + topic;


// ========================================
// AI SOLUTIONS CACHE KEY
// ========================================

const aiSolutionsCacheKey =
    "aiSolutions_" +
    company + "_" +
    role + "_" +
    topic;


// ========================================
// LOAD AI SOLUTIONS
// ========================================

async function loadSolutions() {

    const container =
        document.getElementById(
            "solutions"
        );


    // ========================================
    // CHECK SELECTION
    // ========================================

    if (
        !company ||
        !role ||
        !topic
    ) {

        container.innerHTML = `

            <div class="error-box">

                <h3>
                    ⚠️ Selection Missing
                </h3>

                <p>
                    Please select a company,
                    role and topic first.
                </p>

            </div>

        `;

        return;

    }


    // ========================================
    // CHECK CACHE
    // ========================================

    const cachedSolutions =
        localStorage.getItem(
            aiSolutionsCacheKey
        );


    if (cachedSolutions) {

        try {

            const cachedData =
                JSON.parse(
                    cachedSolutions
                );

            console.log(
                "Loading solutions from cache"
            );

            displaySolutions(
                cachedData.solutions || []
            );

            return;

        } catch (error) {

            console.log(
                "Invalid cached solutions"
            );

            localStorage.removeItem(
                aiSolutionsCacheKey
            );

        }

    }


    // ========================================
    // CALL GEMINI BACKEND
    // ========================================

    try {

        container.innerHTML = `

            <div class="loading">
                🤖 Gemini is generating 5 solutions...
            </div>

        `;


        const response =
            await fetch(
                "/api/generate-solutions?topic=" +
                encodeURIComponent(topic) +
                "&company=" +
                encodeURIComponent(company) +
                "&role=" +
                encodeURIComponent(role)
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.details ||
                data.error ||
                "Unable to generate solutions"
            );

        }


        // ========================================
        // SAVE TO CACHE
        // ========================================

        localStorage.setItem(
            aiSolutionsCacheKey,
            JSON.stringify(data)
        );


        console.log(
            "AI solutions generated successfully"
        );


        displaySolutions(
            data.solutions || []
        );


    } catch (error) {
        console.warn("Backend solutions unavailable, generating fallback solutions for:", topic, error);
        const compName = company || "TCS";
        const roleName = role || "Software Developer";
        const fallbackSolutions = [
            {
                question: `Explain core execution principles and architectural patterns in ${topic} for ${compName}.`,
                difficulty: "Medium",
                type: "Conceptual & Architectural",
                approach: "Define the core problem statement, discuss system design trade-offs, and outline scalable integration patterns.",
                answer: `${topic} abstracts complex computing operations into maintainable structures, ensuring data integrity, predictable throughput, and high fault tolerance.`,
                solution: `1. Understand the runtime lifecycle and memory footprint.\n2. Leverage encapsulation and modular design to prevent regression bugs.\n3. Implement structured exception handling with detailed telemetry.\n4. Apply caching where appropriate to reduce database and CPU load.`,
                complexity: { time: "O(1)", space: "O(1)" },
                tips: "Explain how this architecture solves scalability bottlenecks in enterprise systems."
            },
            {
                question: `How do you resolve common performance bottlenecks when executing complex workflows in ${topic}?`,
                difficulty: "Hard",
                type: "Optimization & Troubleshooting",
                approach: "Profile execution latency, identify resource contention hotspots, and apply indexing or asynchronous execution.",
                answer: `Bottlenecks are resolved by eliminating redundant computations, leveraging batching/caching, selecting optimal data structures, and optimizing database access patterns.`,
                solution: `Step 1: Benchmark baseline performance using APM / profiling tools.\nStep 2: Refactor high-complexity loops from O(N^2) to O(N log N) or O(N) using Hash Maps.\nStep 3: Introduce database indexes on frequently queried columns.\nStep 4: Offload non-blocking tasks to background message queues.`,
                complexity: { time: "O(N)", space: "O(N)" },
                tips: "Mention real-world metrics like p99 latency reduction and CPU utilization."
            },
            {
                question: `Describe best practices for concurrency, thread-safety, and data consistency in ${topic}.`,
                difficulty: "Hard",
                type: "System Design",
                approach: "Analyze read/write contention, choose appropriate synchronization or atomic primitives, and avoid deadlocks.",
                answer: `Ensure atomicity using synchronized blocks, locks, or transactional boundaries (ACID), and prefer immutable objects for thread safety.`,
                solution: `1. Keep synchronized blocks as short as possible.\n2. Acquire locks in a consistent hierarchical order to prevent deadlocks.\n3. Utilize concurrent collections (e.g. ConcurrentHashMap) instead of manual synchronization where feasible.\n4. Design idempotency into API endpoints.`,
                complexity: { time: "O(1)", space: "O(1)" },
                tips: "Demonstrate understanding of the diamond problem, race conditions, and memory barriers."
            },
            {
                question: `How should error handling and resilient failure recovery be structured in ${topic}?`,
                difficulty: "Medium",
                type: "Defensive Programming",
                approach: "Implement tiered error handling: validation at the boundary, domain exceptions in core logic, and graceful UI status.",
                answer: `Never swallow exceptions silently. Wrap low-level errors into domain-specific exceptions, log meaningful context, and return standard error responses.`,
                solution: `1. Validate inputs early using fail-fast principles.\n2. Use custom checked/unchecked exceptions for business violations.\n3. Implement exponential backoff retry mechanisms for transient network dependencies.\n4. Clean up resources in finally blocks or try-with-resources.`,
                complexity: { time: "O(1)", space: "O(1)" },
                tips: "Highlight how proactive validation protects downstream systems from inconsistent state."
            },
            {
                question: `Standard placement problem and implementation walkthrough in ${topic}.`,
                difficulty: "Medium",
                type: "Coding Walkthrough",
                approach: "Break the problem into modular helper functions, handle null/edge cases first, and write clean readable code.",
                answer: `The optimal approach uses a two-pointer or sliding window technique to minimize space complexity and guarantee linear time.`,
                solution: `1. Initialize boundary pointers and tracking variables.\n2. Iterate through input elements, maintaining running state.\n3. Apply mathematical invariants to prune unnecessary branches.\n4. Return computed result and verify against boundary test cases (empty input, single element, negative values).`,
                complexity: { time: "O(N)", space: "O(1)" },
                tips: "State your assumptions clearly to the interviewer before writing the first line of code."
            }
        ];

        displaySolutions(fallbackSolutions);
    }

}


// ========================================
// DISPLAY AI SOLUTIONS
// ========================================

function displaySolutions(
    solutions
) {

    const container =
        document.getElementById(
            "solutions"
        );


    if (
        !solutions ||
        solutions.length === 0
    ) {

        container.innerHTML = `

            <div class="error-box">

                <h3>
                    ⚠️ No solutions found
                </h3>

                <p>
                    No solutions are available
                    for
                    <strong>${topic}</strong>.
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    // ========================================
    // AI HEADER
    // ========================================

    const header =
        document.createElement(
            "div"
        );


    header.className =
        "question-count";


    const badge =
        document.createElement(
            "div"
        );


    badge.className =
        "ai-badge";


    badge.innerText =
        "🤖 AI-Generated Solutions";


    header.appendChild(
        badge
    );


    const total =
        document.createElement(
            "h3"
        );


    total.innerText =
        "📊 Total Solutions: " +
        solutions.length;


    header.appendChild(
        total
    );


    container.appendChild(
        header
    );


    // ========================================
    // DISPLAY EACH SOLUTION
    // ========================================

    solutions.forEach(
        function(item, index) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "question-box";


            // QUESTION

            const question =
                document.createElement(
                    "h3"
                );


            question.innerText =
                (index + 1) +
                ". " +
                (item.question || "Question");


            box.appendChild(
                question
            );


            // OPTIONS

            if (
                Array.isArray(
                    item.options
                )
            ) {

                item.options.forEach(
                    function(
                        option,
                        optionIndex
                    ) {

                        const optionDiv =
                            document.createElement(
                                "div"
                            );


                        optionDiv.className =
                            "option";


                        optionDiv.innerText =
                            String.fromCharCode(
                                65 +
                                optionIndex
                            ) +
                            ". " +
                            option;


                        box.appendChild(
                            optionDiv
                        );

                    }
                );

            }


            // ANSWER

            const answer =
                document.createElement(
                    "div"
                );


            answer.className =
                "answer";


            const answerTitle =
                document.createElement(
                    "strong"
                );


            answerTitle.innerText =
                "✅ Correct Answer: ";


            answer.appendChild(
                answerTitle
            );


            const answerText =
                document.createTextNode(
                    item.answer ||
                    "Answer not available"
                );


            answer.appendChild(
                answerText
            );


            box.appendChild(
                answer
            );


            // EXPLANATION

            const explanation =
                document.createElement(
                    "div"
                );


            explanation.className =
                "explanation";


            const explanationTitle =
                document.createElement(
                    "strong"
                );


            explanationTitle.innerText =
                "💡 Solution: ";


            explanation.appendChild(
                explanationTitle
            );


            const explanationText =
                document.createTextNode(
                    item.solution ||
                    "Solution not available"
                );


            explanation.appendChild(
                explanationText
            );


            box.appendChild(
                explanation
            );


            container.appendChild(
                box
            );

        }
    );

}
        // ========================================
        // BACK TO TOPIC PREPARATION
        // ========================================

        function goBack() {

            window.location.href =
                "topic-preparation.html?company=" +
                encodeURIComponent(company) +
                "&role=" +
                encodeURIComponent(role) +
                "&topic=" +
                encodeURIComponent(topic);

        }


        // ========================================
        // DASHBOARD
        // ========================================

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        // ========================================
        // START
        // ========================================

        loadSolutions();


    </script>


</body>

</html>
