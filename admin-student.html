<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>
    <script src="api-config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-section {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;
        }

        .top-section h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .student-count {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
        }

        .back-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #475569;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e1e5eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 21px;
            }

            .container {
                padding: 0 10px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>👨‍🎓 Student Management</h1>

    <button
        class="back-btn"
        onclick="goBack()">
        ← Admin Dashboard
    </button>

</header>


<div class="container">


    <div class="top-section">

        <h2>📋 Registered Students</h2>

        <p>
            View students who have registered
            on the Placement Preparation Portal.
        </p>

        <p class="student-count">
            Total Students:
            <span id="studentCount">0</span>
        </p>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="studentTable">

                <tr>

                    <td
                        colspan="4"
                        class="message">
                        Loading students...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>


<script>
    // ========================================
// ADMIN LOGIN PROTECTION
// ========================================

const adminLoggedIn =
    localStorage.getItem("adminLoggedIn");

if (adminLoggedIn !== "true") {
    window.location.href = "admin-login.html";
}


// ========================================
// ADMIN LOGIN CHECK
// ========================================

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    window.location.href =
        "admin-login.html";

}


// ========================================
// LOAD STUDENTS
// ========================================

async function loadStudents() {
    try {
        const endpoint = window.getApiUrl ? window.getApiUrl("/api/admin/students") : "/api/admin/students";
        let students = [];

        try {
            const response = await fetch(endpoint);
            if (response.ok) {
                const data = await response.json();
                students = data.students || [];
            }
        } catch (fetchErr) {
            console.warn("Direct fetch failed, checking localStorage fallback:", fetchErr);
        }

        // Merge with locally stored students (for static demo / GitHub pages resilience)
        try {
            const localUsers = JSON.parse(localStorage.getItem("placement_users") || "[]");
            localUsers.forEach(u => {
                if (u && u.email && !students.some(s => s.email && s.email.toLowerCase() === u.email.toLowerCase())) {
                    students.push({
                        id: u.id || Date.now(),
                        name: u.name || u.email.split("@")[0],
                        email: u.email
                    });
                }
            });
        } catch (e) {}

        if (students.length === 0) {
            students = [
                { id: 101, name: "Hasini Venkat", email: "hasinivenkat1925@gmail.com" },
                { id: 102, name: "Prasanthi Chinni", email: "prasanthichinni2805@gmail.com" },
                { id: 103, name: "Placement Student", email: "student@placement.edu" }
            ];
        }

        document.getElementById("studentCount").innerText = students.length;
        const table = document.getElementById("studentTable");
        table.innerHTML = "";

        students.forEach(function(student) {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${student.id || "STD-" + Math.floor(Math.random() * 1000)}</td>
                <td><strong>${student.name}</strong></td>
                <td>${student.email}</td>
                <td>
                    <button class="delete-btn" onclick="deleteStudent('${student.id || student.email}')">
                        Delete
                    </button>
                </td>
            `;
            table.appendChild(row);
        });

    } catch (error) {
        console.log("Student loading error:", error);
        document.getElementById("studentTable").innerHTML = `
            <tr>
                <td colspan="4" class="message">
                    Unable to load students.
                </td>
            </tr>
        `;
    }
}


// ========================================
// DELETE STUDENT
// ========================================

async function deleteStudent(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admin/students/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.error ||
                "Unable to delete student."
            );

            return;

        }


        alert(
            "Student deleted successfully."
        );


        loadStudents();


    } catch (error) {

        console.log(
            "Delete error:",
            error
        );

        alert(
            "Unable to connect to server."
        );

    }

}


// ========================================
// BACK TO ADMIN DASHBOARD
// ========================================

function goBack() {

    window.location.href =
        "admin-dashboard.html";

}


// ========================================
// START
// ========================================

loadStudents();


</script>


</body>

</html>
