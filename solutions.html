<!DOCTYPE html>
<html>

<head>
    <title>Placement Solutions</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
            color: #1f2937;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .question-box {
            background: #f8fafc;
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #2563eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .question-box h3 {
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .answer-text {
            background: #ecfdf5;
            color: #065f46;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 12px;
            border: 1px solid #a7f3d0;
        }

        .solution-text {
            background: #eff6ff;
            color: #1e40af;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #bfdbfe;
            line-height: 1.6;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-secondary:hover {
            background: #475569;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>💡 Questions & Detailed Solutions</h1>
    </div>

    <div class="container">
        <h2 id="companyTitle" style="color: #1e3a8a; margin-top: 0;">🏢 Company: Loading...</h2>
        <h3 id="roleTitle" style="color: #4b5563; font-weight: normal; margin-bottom: 20px;">💼 Role: Loading...</h3>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 25px;">

        <div id="solutions">
            <p>Loading questions & solutions...</p>
        </div>

        <br>
        <div style="margin-top: 20px;">
            <button class="btn btn-secondary" onclick="goBack()">← Back</button>
            <button class="btn" onclick="goDashboard()">🏠 Dashboard</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const company = params.get("company") || localStorage.getItem("company") || "TCS";
        const role = params.get("role") || localStorage.getItem("role") || "Software Developer";

        document.getElementById("companyTitle").innerText = "🏢 Company: " + company;
        document.getElementById("roleTitle").innerText = "💼 Role: " + role;

        async function loadSolutions() {
            const container = document.getElementById("solutions");
            try {
                container.innerHTML = "<h3>🤖 Generating AI questions & solutions...</h3><p>Please wait...</p>";
                
                const response = await fetch(
                    "/api/generate-company-solutions?company=" + encodeURIComponent(company) + "&role=" + encodeURIComponent(role)
                );
                
                if (!response.ok) {
                    throw new Error("Unable to load company solutions");
                }
                
                const data = await response.json();
                const solutions = data.solutions || [];
                
                if (solutions.length === 0) {
                    throw new Error("No solutions available");
                }
                
                container.innerHTML = "";
                const isFallback = data.source === "fallback";
                
                const total = document.createElement("h3");
                total.style.color = "#1e3a8a";
                total.style.marginBottom = "15px";
                total.innerText = isFallback 
                    ? "📚 Company Questions & Solutions: " + solutions.length 
                    : "🤖 AI Questions & Solutions: " + solutions.length;
                container.appendChild(total);
                
                const info = document.createElement("p");
                info.style.color = "#64748b";
                info.style.marginBottom = "25px";
                if (isFallback) {
                    info.innerHTML = "📚 Showing standard placement questions and solutions for <strong>" + company + " - " + role + "</strong>.";
                } else {
                    info.innerHTML = "🤖 AI-generated questions and solutions for <strong>" + company + " - " + role + "</strong>.";
                }
                container.appendChild(info);
                
                solutions.forEach((item, index) => {
                    const box = document.createElement("div");
                    box.className = "question-box";
                    
                    const question = document.createElement("h3");
                    question.innerText = (index + 1) + ". " + item.question;
                    box.appendChild(question);
                    
                    const answer = document.createElement("div");
                    answer.className = "answer-text";
                    answer.innerHTML = "✅ <strong>Answer:</strong> " + item.answer;
                    box.appendChild(answer);
                    
                    const solution = document.createElement("div");
                    solution.className = "solution-text";
                    solution.innerHTML = "💡 <strong>Detailed Solution:</strong><br>" + item.solution;
                    box.appendChild(solution);
                    
                    container.appendChild(box);
                });
            } catch (error) {
                console.warn("Backend solutions unavailable, loading questions.json fallback:", error);
                try {
                    const staticRes = await fetch("questions.json");
                    const staticData = await staticRes.json();
                    const filtered = staticData.filter(q => 
                        (q.company && q.company.toLowerCase() === company.toLowerCase()) ||
                        (q.role && q.role.toLowerCase() === role.toLowerCase())
                    );
                    const list = (filtered.length > 0 ? filtered : staticData).slice(0, 5);
                    
                    container.innerHTML = "";
                    const total = document.createElement("h3");
                    total.style.color = "#1e3a8a";
                    total.style.marginBottom = "15px";
                    total.innerText = "📚 Company Questions & Solutions: " + list.length;
                    container.appendChild(total);

                    const info = document.createElement("p");
                    info.style.color = "#64748b";
                    info.style.marginBottom = "25px";
                    info.innerHTML = "📚 Showing standard placement solutions for <strong>" + company + " - " + role + "</strong>.";
                    container.appendChild(info);

                    list.forEach((item, index) => {
                        const box = document.createElement("div");
                        box.className = "question-box";
                        
                        const question = document.createElement("h3");
                        question.innerText = (index + 1) + ". " + item.question;
                        box.appendChild(question);
                        
                        const answer = document.createElement("div");
                        answer.className = "answer-text";
                        answer.innerHTML = "✅ <strong>Answer:</strong> " + item.answer;
                        box.appendChild(answer);
                        
                        const solution = document.createElement("div");
                        solution.className = "solution-text";
                        solution.innerHTML = "💡 <strong>Detailed Solution:</strong><br>" + (item.solution || item.explanation || "Detailed analysis and optimal approach for " + company + " technical interviews.");
                        box.appendChild(solution);
                        
                        container.appendChild(box);
                    });
                } catch (fallbackErr) {
                    container.innerHTML = "<h3>❌ Unable to load solutions</h3><p>Please check your connection and try again.</p>";
                }
            }
        }

        function goBack() {
            window.location.href = "preparation.html?company=" + encodeURIComponent(company) + "&role=" + encodeURIComponent(role);
        }

        function goDashboard() {
            window.location.href = "dashboard.html";
        }

        // Load solutions automatically on page display
        loadSolutions();
    </script>
</body>

</html>
