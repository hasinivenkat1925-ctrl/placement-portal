<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>
    <script src="api-config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 430px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;

            font-size: 17px;
            font-weight: bold;

            margin-bottom: 8px;

            color: #222;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            background: #64748b;
            margin-top: 15px;
        }

        .back-button:hover {
            background: #475569;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            min-height: 24px;
        }

        .success {
            color: green;
        }

        .error {
            color: #dc2626;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
            Login to manage the Placement Portal.
        </p>


        <form onsubmit="adminLogin(event)">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit" id="adminSubmitBtn">
                🔐 Login as Admin
            </button>

        </form>

        <p id="message"></p>

        <button
            class="back-button"
            onclick="goToStudentLogin()"
        >
            ← Back to Student Login
        </button>

    </div>


<script>
const adminEmails = [
    "hasinivenkat1925@gmail.com",
    "prasanthichinni2805@gmail.com",
    "admin@placement.edu",
    "admin@portal.com"
];

async function adminLogin(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("adminSubmitBtn");

    message.innerText = "Checking login...";
    message.className = "";
    if (submitBtn) submitBtn.disabled = true;

    try {
        const adminEndpoint = window.getApiUrl ? window.getApiUrl("/api/admin-login") : "/api/admin-login";
        let response = await fetch(adminEndpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        if (!response.ok && response.status === 404) {
            const altEndpoint = window.getApiUrl ? window.getApiUrl("/admin-login") : "/admin-login";
            response = await fetch(altEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
        }

        const data = await response.json();

        if (response.ok) {
            message.innerText = "✅ Admin login successful!";
            message.className = "success";
            localStorage.setItem("adminLoggedIn", "true");
            localStorage.setItem("adminUser", JSON.stringify(data.admin || { email, role: "Super Admin" }));

            setTimeout(function() {
                window.location.href = "admin-dashboard.html";
            }, 600);
            return;
        } else {
            message.innerText = "❌ " + (data.message || data.error || "Invalid admin email or password.");
            message.className = "error";
            if (submitBtn) submitBtn.disabled = false;
        }
    } catch (error) {
        console.warn("Admin server unavailable, checking authorized credentials:", error);
        const isAuthorizedEmail = adminEmails.map(e => e.toLowerCase()).includes(email);
        const isAuthorizedPassword = password === "admin123" || password === "admin@123";

        if (isAuthorizedEmail && isAuthorizedPassword) {
            message.innerText = "✅ Admin login successful!";
            message.className = "success";
            localStorage.setItem("adminLoggedIn", "true");
            localStorage.setItem("adminUser", JSON.stringify({
                email: email,
                name: email.includes("hasini") ? "Hasini Venkat" : (email.includes("prasanthi") ? "Prasanthi Chinni" : "Administrator"),
                role: "Super Admin"
            }));
            setTimeout(function() {
                window.location.href = "admin-dashboard.html";
            }, 600);
        } else {
            message.innerText = "❌ Invalid admin email or password. Access Denied.";
            message.className = "error";
            if (submitBtn) submitBtn.disabled = false;
        }
    }
}

function goToStudentLogin() {
    window.location.href = "login.html";
}

window.adminLogin = adminLogin;
window.goToStudentLogin = goToStudentLogin;
</script>

</body>

</html>
