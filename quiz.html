<!DOCTYPE html>
<html>

<head>
    <title>Topic Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>📝 Placement Quiz</h1>

    <h2 id="topicTitle">Quiz</h2>

    <form id="quizForm"></form>

    <button type="button" onclick="checkQuiz()">
        Submit Quiz
    </button>

    <h2 id="result"></h2>

    <br>

    <button onclick="goTopics()">
        ← Back to Topics
    </button>

    <button onclick="goDashboard()">
        🏠 Dashboard
    </button>


    <script>

    // Get selected topic, company and role
    const params =
        new URLSearchParams(window.location.search);

    let topic =
        params.get("topic") ||
        localStorage.getItem("selectedTopic") ||
        "sql";

    let company =
        params.get("company") ||
        localStorage.getItem("selectedCompany") ||
        "";

    let role =
        params.get("role") ||
        localStorage.getItem("selectedRole") ||
        "";

    topic = topic.toLowerCase();


    // --------------------------------------------
    // LOAD QUIZ FROM BACKEND
    // --------------------------------------------

    async function loadQuiz() {

        const quizForm =
            document.getElementById("quizForm");

        const topicTitle =
            document.getElementById("topicTitle");

        quizForm.innerHTML =
            "<p>⏳ Loading quiz...</p>";

        try {

            const response =
                await fetch(
                    "/api/generate-quiz?topic=" +
                    encodeURIComponent(topic) +
                    "&company=" +
                    encodeURIComponent(company) +
                    "&role=" +
                    encodeURIComponent(role)
                );


            if (!response.ok) {

                throw new Error(
                    "Quiz API request failed"
                );

            }


            const data =
                await response.json();


            if (
                !data.questions ||
                !Array.isArray(data.questions) ||
                data.questions.length === 0
            ) {

                throw new Error(
                    "No quiz questions received"
                );

            }


            // ------------------------------------
            // CHECK SOURCE
            // ------------------------------------

            const quizSourceBadge =
    document.getElementById("quizSourceBadge");


if (data.source === "fallback") {

    topicTitle.innerText =
        topic.toUpperCase() +
        " Practice Quiz 📚";

    quizSourceBadge.innerText =
        "📚 Practice Quiz";

} else {

    topicTitle.innerText =
        topic.toUpperCase() +
        " AI Generated Quiz 🤖";

    quizSourceBadge.innerText =
        "🤖 AI Generated Quiz";

}

            const questions =
                data.questions;


            // ------------------------------------
            // DISPLAY QUESTIONS
            // ------------------------------------

            quizForm.innerHTML = "";


            questions.forEach(
                function(q, index) {

                    let html = `
                        <div>
                            <h3>
                                ${index + 1}. ${q.question}
                            </h3>
                    `;


                    q.options.forEach(
                        function(option, optionIndex) {

                            html += `
                                <input
                                    type="radio"
                                    name="q${index}"
                                    value="${optionIndex}"
                                >
                                ${option}
                                <br>
                            `;

                        }
                    );


                    html += `
                        </div>
                        <hr>
                    `;


                    quizForm.innerHTML += html;

                }
            );


            // Store questions for checkQuiz()
            window.currentQuestions =
                questions;


            console.log(
                "Quiz source:",
                data.source
            );

            console.log(
                "Questions:",
                questions
            );

        }

        catch (error) {
            console.warn("Backend quiz unavailable, generating client fallback quiz for:", topic, error);
            const compName = company || "TCS";
            const roleName = role || "Software Developer";
            
            const fallbackQuestions = [
                {
                    question: `What is the primary role of ${topic} in developing applications for ${compName}?`,
                    options: [
                        `To enable modular, scalable, and optimized system execution`,
                        `To slow down database transactions`,
                        `To bypass all standard code reviews`,
                        `To prevent memory from ever being allocated`
                    ],
                    answer: `To enable modular, scalable, and optimized system execution`
                },
                {
                    question: `Which fundamental principle is recommended when working with ${topic}?`,
                    options: [
                        `High cohesion and low coupling`,
                        `Global mutable state across all modules`,
                        `Ignoring exception handling entirely`,
                        `Writing all code in a single unformatted function`
                    ],
                    answer: `High cohesion and low coupling`
                },
                {
                    question: `How are resources efficiently managed in ${topic}?`,
                    options: [
                        `Via systematic memory cleanup and structured lifecycle protocols`,
                        `By ignoring memory limits and letting the system crash`,
                        `By allocating infinite static arrays`,
                        `By disabling garbage collection permanently`
                    ],
                    answer: `Via systematic memory cleanup and structured lifecycle protocols`
                },
                {
                    question: `In a technical interview for a ${roleName} role, what is the best practice for handling edge cases in ${topic}?`,
                    options: [
                        `Defensive input validation and robust unit testing`,
                        `Assuming inputs are always valid and non-null`,
                        `Silently catching all exceptions without logging`,
                        `Relying purely on user complaints to find bugs`
                    ],
                    answer: `Defensive input validation and robust unit testing`
                },
                {
                    question: `What time complexity is targeted for standard data retrieval operations in ${topic}?`,
                    options: [
                        `O(1) or O(log N)`,
                        `O(N!) factorial time`,
                        `O(2^N) exponential time`,
                        `O(N^3) cubic time`
                    ],
                    answer: `O(1) or O(log N)`
                }
            ];

            topicTitle.innerText = `Topic: ${topic} (Placement Quiz)`;
            window.currentQuestions = fallbackQuestions;

            quizForm.innerHTML = "";
            fallbackQuestions.forEach(function(q, index) {
                let html = `
                    <div style="margin-bottom: 20px; padding: 15px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0;">
                        <h3 style="font-size: 16px; color: #1e293b; margin-bottom: 10px;">
                            ${index + 1}. ${q.question}
                        </h3>
                `;
                q.options.forEach(function(option, optionIndex) {
                    html += `
                        <label style="display: block; margin: 8px 0; cursor: pointer; color: #334155;">
                            <input type="radio" name="q${index}" value="${optionIndex}" style="margin-right: 8px;">
                            ${option}
                        </label>
                    `;
                });
                html += `</div>`;
                quizForm.innerHTML += html;
            });
        }

    }


    // --------------------------------------------
    // CHECK ANSWERS
    // --------------------------------------------

    function checkQuiz() {

        const questions =
            window.currentQuestions;


        if (
            !questions ||
            questions.length === 0
        ) {

            alert(
                "Quiz is not loaded yet."
            );

            return;

        }


        let score = 0;


        questions.forEach(
            function(q, index) {

                const selected =
                    document.querySelector(
                        'input[name="q' +
                        index +
                        '"]:checked'
                    );


                if (!selected) {
                    return;
                }


                const selectedIndex =
                    Number(selected.value);


                const selectedAnswer =
                    q.options[selectedIndex];


                // Backend gives answer as text
                if (
                    selectedAnswer === q.answer
                ) {

                    score++;

                }

            }
        );


        document.getElementById("result").innerText =
            "Your Score: " +
            score +
            " / " +
            questions.length;


        // ----------------------------------------
        // SAVE PROGRESS
        // ----------------------------------------

        let progress =
            Math.round(
                (score / questions.length) * 100
            );


        localStorage.setItem(
            "progress",
            progress
        );


        localStorage.setItem(
            "quizScore",
            score
        );


        localStorage.setItem(
            "quizTotal",
            questions.length
        );

    }


    // --------------------------------------------
    // NAVIGATION
    // --------------------------------------------

    function goTopics() {

        window.location.href =
            "topics.html";

    }


    function goDashboard() {

        window.location.href =
            "dashboard.html";

    }


    // --------------------------------------------
    // START QUIZ
    // --------------------------------------------

    loadQuiz();

</script>

</body>

</html>
