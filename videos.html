<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Related Videos - Placement Preparation Portal</title>
    <link rel="stylesheet" href="CSS/style.css">

    <style>
        .video-filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-tab {
            background: #111827;
            border: 1px solid #1f293d;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-tab:hover, .filter-tab.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-bottom: 40px;
        }

        .video-card {
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .video-thumb {
            position: relative;
            width: 100%;
            height: 170px;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            overflow: hidden;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.3s ease;
        }

        .video-card:hover .video-thumb img {
            transform: scale(1.05);
            opacity: 1;
        }

        .play-btn-overlay {
            position: absolute;
            width: 52px;
            height: 52px;
            background: rgba(59, 130, 246, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }

        .video-thumb:hover .play-btn-overlay {
            transform: scale(1.15);
            background: #2563eb;
        }

        .duration-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(3, 7, 18, 0.85);
            color: #f8fafc;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .video-info {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .video-category {
            font-size: 11px;
            font-weight: 700;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .video-desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .video-meta-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .meta-tag {
            background: #1e293b;
            color: #cbd5e1;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .watch-btn {
            width: 100%;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .watch-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        /* Modal Player Overlay */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .video-modal.show {
            display: flex;
        }

        .modal-content {
            background: #111827;
            border: 1px solid #1f293d;
            border-radius: 20px;
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-header {
            padding: 16px 22px;
            background: #0f172a;
            border-bottom: 1px solid #1f293d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #f8fafc;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: #ffffff;
        }

        .video-frame-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            background: #000;
        }

        .video-frame-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .modal-body-info {
            padding: 20px;
            color: #e2e8f0;
        }

        @media (max-width: 900px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <script src="nav-header.js"></script>

    <main class="portal-content">

        <!-- HERO HEADER -->
        <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 28px; border-radius: 16px; border: 1px solid #1f293d; margin-bottom: 30px; box-shadow: var(--shadow-md);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h1 style="font-size: 26px; font-weight: 800; color: #f8fafc; margin-bottom: 6px;">🎬 Related Learning Videos</h1>
                    <p style="font-size: 14px; color: #94a3b8; margin: 0;" id="heroSubtext">
                        Curated placement interview walkthroughs, coding demonstrations, and HR behavioral guide videos.
                    </p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;" id="targetBadges">
                    <span style="background: #1e293b; border: 1px solid #334155; color: #3b82f6; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;" id="targetCompanyBadge">🏢 Google</span>
                    <span style="background: #1e293b; border: 1px solid #334155; color: #10b981; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;" id="targetRoleBadge">💼 SDE</span>
                </div>
            </div>
        </div>

        <!-- FILTER TABS & SEARCH -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <div class="video-filter-bar">
                <button class="filter-tab active" onclick="filterVideos('all', this)">All Related Videos</button>
                <button class="filter-tab" onclick="filterVideos('company', this)">🏢 Company PYQs</button>
                <button class="filter-tab" onclick="filterVideos('hr', this)">👤 HR Interviews</button>
                <button class="filter-tab" onclick="filterVideos('technical', this)">💻 Technical & System Design</button>
                <button class="filter-tab" onclick="filterVideos('core', this)">📚 Core CSE & Aptitude</button>
            </div>

            <div style="width: 260px;">
                <input type="text" id="videoSearchInput" placeholder="🔍 Search video topic..." class="form-control" onkeyup="searchVideoCards()">
            </div>
        </div>

        <!-- VIDEO CARDS GRID -->
        <div class="video-grid" id="videoCardsGrid">
            <!-- Dynamically populated video cards -->
        </div>

    </main>

    <!-- VIDEO MODAL PLAYER -->
    <div class="video-modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalVideoTitle">Video Title</div>
                <button class="close-modal-btn" onclick="closeVideoModal()">✕</button>
            </div>
            <div class="video-frame-wrapper">
                <iframe id="modalIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="modal-body-info">
                <p id="modalVideoDesc" style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 12px;"></p>
                <a id="modalExternalBtn" href="#" target="_blank" class="btn btn-secondary" style="font-size: 13px; display: inline-flex;">
                    🔗 Open directly on YouTube
                </a>
            </div>
        </div>
    </div>

    <script>
        const selectedCompany = localStorage.getItem("selectedCompany") || "Google";
        const selectedRole = localStorage.getItem("selectedRole") || "Software Developer";

        document.getElementById("targetCompanyBadge").innerText = "🏢 " + selectedCompany;
        document.getElementById("targetRoleBadge").innerText = "💼 " + selectedRole;

        // Video Catalog Data
        const videoDatabase = [
            {
                id: "v1",
                category: "company",
                title: `${selectedCompany} Placement Coding Round Walkthrough`,
                desc: `Detailed breakdown of top previously asked coding questions and algorithmic problems in ${selectedCompany} placement drives.`,
                duration: "24:15",
                embedId: "8hly31xKli0",
                tags: [selectedCompany, selectedRole, "PYQs", "Coding"],
                thumbImg: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "v2",
                category: "hr",
                title: "How to Answer 'Tell Me About Yourself' in HR Round",
                desc: "Learn the STAR framework to construct crisp, impactful background responses during company HR behavioral interviews.",
                duration: "14:30",
                embedId: "kayOhGRcNt4",
                tags: ["HR Round", "Behavioral", "STAR Method"],
                thumbImg: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "v3",
                category: "technical",
                title: `${selectedRole} System Design & Architecture Basics`,
                desc: "High level system design concepts including load balancing, caching, database scaling, and microservices architecture.",
                duration: "32:10",
                embedId: "xpDnVSmNfx0",
                tags: [selectedRole, "System Design", "Scalability"],
                thumbImg: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "v4",
                category: "company",
                title: `${selectedCompany} Technical Interview Secrets & Experience`,
                desc: "Real placement interview experience, candidate tips, common mistakes to avoid, and screening expectations.",
                duration: "18:45",
                embedId: "Q1pX2gXlAn0",
                tags: [selectedCompany, "Interview Tips", "Experience"],
                thumbImg: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "v5",
                category: "core",
                title: "Top 10 DBMS SQL Queries Asked in Tech Interviews",
                desc: "Practice essential SQL joins, GROUP BY aggregations, HAVING clauses, subqueries, and execution tuning.",
                duration: "21:05",
                embedId: "HXV3zeQKqGY",
                tags: ["SQL", "DBMS", "Database"],
                thumbImg: "https://images.unsplash.com/photo-1544383835-bda2bc66a55d?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "v6",
                category: "technical",
                title: "Data Structures & Algorithms Mock Technical Interview",
                desc: "Watch a live mock technical coding interview covering binary trees, graph traversals, and dynamic programming.",
                duration: "45:00",
                embedId: "1qw5ITr3k9E",
                tags: ["DSA", "Mock Interview", "Algorithms"],
                thumbImg: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=600&auto=format&fit=crop&q=80"
            }
        ];

        function renderVideoCards(videos) {
            const grid = document.getElementById("videoCardsGrid");
            grid.innerHTML = "";

            if (videos.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8; font-size: 15px;">No videos found matching your search query.</div>`;
                return;
            }

            videos.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.setAttribute("data-category", v.category);

                card.innerHTML = `
                    <div class="video-thumb" onclick="playVideo('${v.id}')">
                        <img src="${v.thumbImg}" alt="${v.title}">
                        <div class="play-btn-overlay">▶</div>
                        <div class="duration-badge">⏱️ ${v.duration}</div>
                    </div>
                    <div class="video-info">
                        <div>
                            <div class="video-category">${v.category.toUpperCase()} PREPARATION</div>
                            <div class="video-title">${v.title}</div>
                            <div class="video-desc">${v.desc}</div>
                            <div class="video-meta-tags">
                                ${v.tags.map(t => `<span class="meta-tag">#${t}</span>`).join("")}
                            </div>
                        </div>
                        <button class="watch-btn" onclick="playVideo('${v.id}')">
                            ▶ Watch Video Guide
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(id) {
            const v = videoDatabase.find(item => item.id === id);
            if (!v) return;

            document.getElementById("modalVideoTitle").innerText = v.title;
            document.getElementById("modalVideoDesc").innerText = v.desc;
            document.getElementById("modalIframe").src = `https://www.youtube.com/embed/${v.embedId}?autoplay=1`;
            document.getElementById("modalExternalBtn").href = `https://www.youtube.com/watch?v=${v.embedId}`;
            document.getElementById("videoModal").classList.add("show");
        }

        function closeVideoModal() {
            document.getElementById("videoModal").classList.remove("show");
            document.getElementById("modalIframe").src = "";
        }

        function filterVideos(cat, btn) {
            document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");

            if (cat === "all") {
                renderVideoCards(videoDatabase);
            } else {
                const filtered = videoDatabase.filter(v => v.category === cat);
                renderVideoCards(filtered);
            }
        }

        function searchVideoCards() {
            const query = document.getElementById("videoSearchInput").value.toLowerCase().trim();
            const filtered = videoDatabase.filter(v => 
                v.title.toLowerCase().includes(query) ||
                v.desc.toLowerCase().includes(query) ||
                v.tags.some(t => t.toLowerCase().includes(query))
            );
            renderVideoCards(filtered);
        }

        renderVideoCards(videoDatabase);
    </script>

</body>

</html>
