<!DOCTYPE html>
<html>

<head>
    <title>Company Placement Quiz</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="api-config.js"></script>

    <style>

        #timer {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
        }

        .question-box {
            margin-bottom: 30px;
            padding: 15px;
            border-bottom: 1px solid #ccc;
        }

        .option {
            margin: 10px 0;
        }

        #result {
            margin-top: 20px;
        }

        .result-box {
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }

        .result-box p {
            font-size: 18px;
        }

        .correct {
            color: green;
        }

        .wrong {
            color: red;
        }

        .unanswered {
            color: gray;
        }

        .navigation {
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .navigation button {
            margin-right: 10px;
        }

        #questionNumber {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

    </style>

</head>


<body>
<script src="nav-header.js"></script>

<h1>🏢 Company Placement Quiz</h1>

<h2 id="companyTitle"></h2>

<h3 id="roleTitle"></h3>

<p id="quizInfo"></p>


<!-- TIMER -->

<h2 id="timer">
    ⏱️ Time Left: 10:00
</h2>

<hr>


<!-- QUESTION NUMBER -->

<h3 id="questionNumber"></h3>


<div id="quizContainer">
    Loading questions...
</div>


<!-- NAVIGATION -->

<div
    id="navigation"
    class="navigation"
    style="display:none;">

    <button
        id="previousButton"
        onclick="previousQuestion()">

        ◀ Previous

    </button>


    <button
        id="nextButton"
        onclick="nextQuestion()">

        Next ▶

    </button>

</div>


<br>


<button
    id="submitButton"
    onclick="submitQuiz()">

    ✅ Submit Quiz

</button>


<h2 id="result"></h2>


<br>


<button onclick="goPreparation()">
    ← Back to Preparation
</button>


<button onclick="goDashboard()">
    🏠 Dashboard
</button>



<script>


// ==========================================
// GET COMPANY + ROLE
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const company =
    params.get("company") || "";


const role =
    params.get("role") || "";



// ==========================================
// CHECK LOGIN
// ==========================================

const loggedInUser =
    localStorage.getItem(
        "loggedInUser"
    );


if (!loggedInUser) {

    window.location.href =
        "login.html";

}



// ==========================================
// GET STUDENT
// ==========================================

let currentUser = null;


try {

    currentUser =
        JSON.parse(
            loggedInUser
        );

} catch (error) {

    localStorage.removeItem(
        "loggedInUser"
    );

    window.location.href =
        "login.html";

}



// ==========================================
// VARIABLES
// ==========================================

let questions = [];

let currentQuestion = 0;

let selectedAnswers = [];

let timeLeft = 600;

let timerInterval;

let quizSubmitted = false;



// ==========================================
// DISPLAY COMPANY
// ==========================================

document.getElementById(
    "companyTitle"
).innerText =
    "🏢 Company: " +
    company;



// ==========================================
// DISPLAY ROLE
// ==========================================

document.getElementById(
    "roleTitle"
).innerText =
    "💼 Role: " +
    role;



// ==========================================
// DISPLAY INFO
// ==========================================

document.getElementById(
    "quizInfo"
).innerText =
    "📚 Questions for " +
    company +
    " - " +
    role;



// ==========================================
// LOAD QUESTIONS
// ==========================================

async function loadQuestions() {

    try {

        if (!company || !role) {

            document.getElementById(
                "quizContainer"
            ).innerHTML =
                "<h3>⚠️ Company or role missing.</h3>";

            return;
        }

        document.getElementById(
            "quizContainer"
        ).innerHTML =
            "<h3>🤖 Generating AI Quiz...</h3>" +
            "<p>Please wait while Gemini prepares your questions.</p>";

        const response =
            await fetch(
                "/api/generate-company-quiz?company=" +
                encodeURIComponent(company) +
                "&role=" +
                encodeURIComponent(role)
            );

        if (!response.ok) {

            throw new Error(
                "Unable to generate AI quiz"
            );

        }

        const data =
            await response.json();

        questions =
            data.questions || [];

        selectedAnswers =
            new Array(
                questions.length
            ).fill(null);

        if (questions.length > 0) {

            displayQuestion();

            startTimer();

        }

        else {

            document.getElementById(
                "quizContainer"
            ).innerHTML =
                "<h3>❌ No AI questions generated.</h3>";

        }

    }

function getRoleQuizFallback(companyName, roleName) {
    const r = String(roleName || "").toLowerCase();
    if (r.includes("frontend")) {
        return [
            { question: "Which CSS display property initializes a flexbox container layout?", options: ["flex", "block-flex", "grid", "inline-grid"], answer: "flex", explanation: "`display: flex;` initializes the flexbox layout context on an element." },
            { question: "In modern JavaScript, what is the variable scope of 'const'?", options: ["Block scope", "Function scope", "Global scope", "Lexical scope only"], answer: "Block scope", explanation: "Variables declared with `let` and `const` are scoped to the block `{}`." },
            { question: "Which React hook is used to trigger asynchronous side effects?", options: ["useEffect", "useState", "useMemo", "useContext"], answer: "useEffect", explanation: "The `useEffect` hook manages asynchronous side effects like data fetching and subscriptions." },
            { question: "Which HTTP header is configured to allow cross-origin requests?", options: ["Access-Control-Allow-Origin", "Content-Security-Policy", "Authorization", "X-Frame-Options"], answer: "Access-Control-Allow-Origin", explanation: "This header specifies which origins are permitted to access the server's resource." },
            { question: "Which DOM method retrieves a single element by its ID?", options: ["getElementById", "querySelector", "getElementsByClassName", "querySelectorAll"], answer: "getElementById", explanation: "`document.getElementById()` retrieves a single element matching the unique ID." }
        ];
    }
    if (r.includes("data analyst") || r.includes("analyst") || r.includes("bi")) {
        return [
            { question: "Which Excel tool summarizes and aggregates large tabular datasets?", options: ["Pivot Table", "VLOOKUP", "Conditional Formatting", "Data Validation"], answer: "Pivot Table", explanation: "Pivot Tables allow rapid grouping, summation, and cross-tabulation of dataset records." },
            { question: "Which SQL clause is used to filter records after aggregation?", options: ["HAVING", "WHERE", "ORDER BY", "GROUP BY"], answer: "HAVING", explanation: "The HAVING clause filters aggregate records produced by GROUP BY." },
            { question: "What does a correlation coefficient of -1 indicate?", options: ["Perfect negative relationship", "No relationship", "Perfect positive relationship", "High data variance"], answer: "Perfect negative relationship", explanation: "An 'r' of -1 represents a perfect negative linear correlation." },
            { question: "Which SQL aggregate function calculates the mean of a numeric column?", options: ["AVG()", "MEAN()", "SUM() / COUNT()", "MEDIAN()"], answer: "AVG()", explanation: "The AVG() function returns the arithmetic mean of numeric values." },
            { question: "Which chart is best suited for showing continuous data distribution frequencies?", options: ["Histogram", "Bar Chart", "Line Chart", "Scatter Plot"], answer: "Histogram", explanation: "Histograms group continuous data into bin ranges to show frequency distributions." }
        ];
    }
    if (r.includes("python")) {
        return [
            { question: "Which built-in Python data sequence type is immutable?", options: ["Tuple", "List", "Dictionary", "Set"], answer: "Tuple", explanation: "Tuples are immutable; their elements cannot be modified after creation." },
            { question: "Which keyword is used to pause function execution and return a generator?", options: ["yield", "return", "lambda", "global"], answer: "yield", explanation: "The `yield` keyword converts a function into a generator iterator." },
            { question: "Which built-in function returns the total number of items in a Python collection?", options: ["len()", "count()", "size()", "length()"], answer: "len()", explanation: "`len()` returns the count of items in any sequence or mapping." },
            { question: "Which block handles runtime exceptions in Python?", options: ["try-except", "try-catch", "throw-catch", "try-finally"], answer: "try-except", explanation: "Python uses `try` and `except` blocks to handle script exceptions gracefully." },
            { question: "Which function deserializes a JSON string into a Python dictionary?", options: ["json.loads()", "json.dumps()", "json.load()", "json.dump()"], answer: "json.loads()", explanation: "`json.loads()` converts a JSON string into Python dictionaries or lists." }
        ];
    }
    if (r.includes("backend")) {
        return [
            { question: "Which HTTP status code signifies successful creation of a new resource?", options: ["201 Created", "200 OK", "301 Moved Permanently", "400 Bad Request"], answer: "201 Created", explanation: "201 Created indicates the request succeeded and resulted in a new resource." },
            { question: "What is the primary purpose of database indexes?", options: ["Speed up query retrieval", "Encrypt stored data", "Enforce foreign keys", "Compress table size"], answer: "Speed up query retrieval", explanation: "Indexes build search data structures (B-trees) to execute queries faster." },
            { question: "Which architectural style uses Protocol Buffers over HTTP/2?", options: ["gRPC", "REST", "GraphQL", "SOAP"], answer: "gRPC", explanation: "gRPC uses binary Protocol Buffers and HTTP/2 multiplexed streams." },
            { question: "Which HTTP method is idempotent and replaces an entire target resource payload?", options: ["PUT", "POST", "PATCH", "DELETE"], answer: "PUT", explanation: "PUT requests are idempotent; repeating the exact call yields the same result." },
            { question: "What is a major symptom of database connection pool exhaustion?", options: ["API request timeout", "Database corruption", "SSL handshake error", "Data replication drift"], answer: "API request timeout", explanation: "When pool connections are exhausted, incoming requests block until timing out." }
        ];
    }
    if (r.includes("devops") || r.includes("sre")) {
        return [
            { question: "What is the primary benefit of Infrastructure as Code (IaC)?", options: ["Repeatable automated infrastructure deployments", "Faster CPU performance", "Encrypted database tables", "Free cloud hosting"], answer: "Repeatable automated infrastructure deployments", explanation: "IaC manages infrastructure using configuration files, eliminating manual errors." },
            { question: "What is the primary difference between VMs and Docker Containers?", options: ["Containers share host OS kernel; VMs run full guest OS", "VMs are faster than containers", "Containers require hypervisors", "VMs run only on Linux"], answer: "Containers share host OS kernel; VMs run full guest OS", explanation: "Containers virtualize user space, sharing the underlying OS kernel for speed." },
            { question: "Which open-source platform orchestrates containerized applications at scale?", options: ["Kubernetes", "Docker Engine", "Jenkins", "Ansible"], answer: "Kubernetes", explanation: "Kubernetes automates deployment, scaling, and management of container clusters." },
            { question: "Which tool collects and stores time-series metric data for monitoring?", options: ["Prometheus", "Grafana", "GitLab", "Terraform"], answer: "Prometheus", explanation: "Prometheus scrapes and stores real-time telemetry metrics." },
            { question: "Which deployment strategy switches active user traffic between identical environments?", options: ["Blue-Green deployment", "Rolling update", "Canary release", "Shadow deployment"], answer: "Blue-Green deployment", explanation: "Blue-Green deployment switches router target from active Blue to new Green." }
        ];
    }
    // Default SDE / Software Developer
    return [
        { question: "Which data structure operates on a Last In First Out (LIFO) basis?", options: ["Stack", "Queue", "Array", "Linked List"], answer: "Stack", explanation: "A stack is a linear data structure that stores items in a Last-In, First-Out (LIFO) manner." },
        { question: "What is the average time complexity of searching in a Hash Table?", options: ["O(1)", "O(n)", "O(log n)", "O(n²)"], answer: "O(1)", explanation: "With a good hash function, the average time complexity for Hash Table lookups is constant O(1)." },
        { question: "Which sorting algorithm guarantees a worst-case time complexity of O(n log n)?", options: ["Merge Sort", "Bubble Sort", "Quick Sort", "Insertion Sort"], answer: "Merge Sort", explanation: "Merge Sort consistently splits the array in half and merges, guaranteeing O(n log n) even in the worst case." },
        { question: "Which process state represents waiting for a CPU scheduler execution turn?", options: ["Ready", "Running", "Blocked", "Terminated"], answer: "Ready", explanation: "A process in the 'Ready' state is completely loaded in main memory and waiting for the CPU scheduler." },
        { question: "In the OSI model, which layer manages IP addressing and packet routing?", options: ["Network Layer", "Transport Layer", "Data Link Layer", "Physical Layer"], answer: "Network Layer", explanation: "The Network Layer handles IP addressing, routing tables, and routing packets between nodes." }
    ];
}

    catch (error) {
        console.warn("Backend quiz unavailable, loading role-tailored fallback:", error);
        try {
            const staticRes = await fetch("questions.json");
            const staticData = await staticRes.json();
            const filtered = staticData.filter(q => 
                (q.company && q.company.toLowerCase() === company.toLowerCase()) &&
                (q.role && q.role.toLowerCase() === role.toLowerCase())
            );
            if (filtered.length > 0) {
                questions = filtered.slice(0, 5).map(q => ({
                    question: q.question,
                    options: [
                        q.answer,
                        `Incorrect alternative implementation pattern`,
                        `Deprecated legacy approach`,
                        `Randomized linear brute-force scan`
                    ].sort(() => Math.random() - 0.5),
                    answer: q.answer,
                    explanation: q.explanation || "Detailed placement question solution."
                }));
            } else {
                questions = getRoleQuizFallback(company, role);
            }
            
            selectedAnswers = new Array(questions.length).fill(null);
            displayQuestion();
            startTimer();
        } catch (fallbackErr) {
            questions = getRoleQuizFallback(company, role);
            selectedAnswers = new Array(questions.length).fill(null);
            displayQuestion();
            startTimer();
        }
    }
}


// ==========================================
// DISPLAY CURRENT QUESTION
// ==========================================

function displayQuestion() {

    const container =
        document.getElementById(
            "quizContainer"
        );


    container.innerHTML = "";


    if (
        questions.length === 0
    ) {

        container.innerHTML =
            "<h3>❌ No questions found for " +
            company +
            " - " +
            role +
            "</h3>";

        return;

    }


    // ======================================
    // QUESTION NUMBER
    // ======================================

    document.getElementById(
        "questionNumber"
    ).innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;



    const item =
        questions[
            currentQuestion
        ];


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "question-box";


    let html = "";


    // ======================================
    // QUESTION
    // ======================================

    html +=
        "<h3>" +
        (currentQuestion + 1) +
        ". " +
        escapeHtml(
            item.question
        ) +
        "</h3>";


    // ======================================
    // TOPIC
    // ======================================

    html +=
        "<p>📚 Topic: " +
        escapeHtml(
            item.category ||
            "General"
        ) +
        "</p>";



    // ======================================
    // OPTIONS
    // ======================================

    if (
        Array.isArray(
            item.options
        )
    ) {

        item.options.forEach(
            function(
                option,
                optionIndex
            ) {

                const letter =
                    String.fromCharCode(
                        65 +
                        optionIndex
                    );


                const isChecked =
                    selectedAnswers[
                        currentQuestion
                    ] ===
                    option;


                html +=

                    '<div class="option">' +

                    '<label>' +

                    '<input type="radio" ' +

                    'name="currentQuestion" ' +

                    'value="' +
                    escapeHtml(
                        option
                    ) +
                    '"' +

                    (
                        isChecked
                        ? " checked"
                        : ""
                    ) +

                    ' onchange="saveAnswer(this.value)">' +

                    " <b>" +
                    letter +
                    ".</b> " +

                    escapeHtml(
                        option
                    ) +

                    "</label>" +

                    "</div>";

            }
        );

    }


    box.innerHTML =
        html;


    container.appendChild(
        box
    );


    // ======================================
    // NAVIGATION
    // ======================================

    document.getElementById(
        "navigation"
    ).style.display =
        "block";


    updateNavigationButtons();

}



// ==========================================
// SAVE ANSWER
// ==========================================

function saveAnswer(value) {

    selectedAnswers[
        currentQuestion
    ] = value;

}



// ==========================================
// PREVIOUS QUESTION
// ==========================================

function previousQuestion() {

    if (
        currentQuestion <= 0
    ) {

        return;

    }


    currentQuestion--;


    displayQuestion();

}



// ==========================================
// NEXT QUESTION
// ==========================================

function nextQuestion() {

    if (
        currentQuestion >=
        questions.length - 1
    ) {

        return;

    }


    currentQuestion++;


    displayQuestion();

}



// ==========================================
// UPDATE NAVIGATION BUTTONS
// ==========================================

function updateNavigationButtons() {

    const previousButton =
        document.getElementById(
            "previousButton"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    // Previous

    if (
        currentQuestion === 0
    ) {

        previousButton.disabled =
            true;

    }

    else {

        previousButton.disabled =
            false;

    }


    // Next

    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.disabled =
            true;

    }

    else {

        nextButton.disabled =
            false;

    }

}



// ==========================================
// TIMER
// ==========================================

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            function() {

                timeLeft--;


                updateTimer();


                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "⏰ Time is over! Your quiz will be submitted."
                    );


                    submitQuiz();

                }

            },
            1000
        );

}



// ==========================================
// UPDATE TIMER
// ==========================================

function updateTimer() {

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).innerText =
        "⏱️ Time Left: " +
        minutes +
        ":" +
        String(
            seconds
        ).padStart(
            2,
            "0"
        );

}



// ==========================================
// SUBMIT QUIZ
// ==========================================

// ==========================================
// SUBMIT QUIZ
// ==========================================

async function submitQuiz() {

    if (quizSubmitted) {
        return;
    }

    if (questions.length === 0) {
        return;
    }

    quizSubmitted = true;

    clearInterval(timerInterval);

    let score = 0;
    let wrongAnswers = 0;
    let unanswered = 0;


    // ======================================
    // CHECK ANSWERS
    // ======================================

    questions.forEach(function(item, index) {

        const selected =
            selectedAnswers[index];

        if (!selected) {

            unanswered++;

        }

        else if (
            selected ===
            String(item.answer)
        ) {

            score++;

        }

        else {

            wrongAnswers++;

        }

    });


    // ======================================
    // PERCENTAGE
    // ======================================

    const percentage =
        Math.round(
            (score / questions.length) * 100
        );


    // ======================================
    // SHOW RESULT
    // ======================================

    document.getElementById(
        "questionNumber"
    ).innerText =
        "🎉 Quiz Finished";


    document.getElementById(
        "quizContainer"
    ).innerHTML = `

        <div class="result-box">

            <h2>
                🎉 Quiz Completed!
            </h2>

            <p>
                👤 Student:
                <strong>
                    ${escapeHtml(currentUser.name)}
                </strong>
            </p>

            <hr>

            <p>
                🏢 Company:
                <strong>
                    ${escapeHtml(company)}
                </strong>
            </p>

            <p>
                💼 Role:
                <strong>
                    ${escapeHtml(role)}
                </strong>
            </p>

            <hr>

            <p>
                📊 Score:
                <strong>
                    ${score} / ${questions.length}
                </strong>
            </p>

            <p>
                📈 Percentage:
                <strong>
                    ${percentage}%
                </strong>
            </p>

            <p class="correct">
                ✅ Correct:
                <strong>
                    ${score}
                </strong>
            </p>

            <p class="wrong">
                ❌ Wrong:
                <strong>
                    ${wrongAnswers}
                </strong>
            </p>

            <p class="unanswered">
                ⚪ Unanswered:
                <strong>
                    ${unanswered}
                </strong>
            </p>

            <br>

            <button onclick="retakeQuiz()">
                🔄 Retake Quiz
            </button>

        </div>

    `;


    // ======================================
    // HIDE NAVIGATION
    // ======================================

    document.getElementById(
        "navigation"
    ).style.display =
        "none";


    // ======================================
    // DISABLE SUBMIT BUTTON
    // ======================================

    document.getElementById(
        "submitButton"
    ).disabled = true;


    // ======================================
    // STUDENT EMAIL
    // ======================================

    const studentEmail =
        currentUser.email
            .toLowerCase()
            .trim();


    // ======================================
    // SAVE OLD LOCAL PROGRESS
    // ======================================

    const progressKey =
        "progress_" +
        studentEmail +
        "_" +
        company +
        "_" +
        role;


    localStorage.setItem(
        progressKey,
        percentage
    );


    // ======================================
    // SAVE OLD LOCAL RESULT
    // ======================================

    const resultKey =
        "quizResult_" +
        studentEmail +
        "_" +
        company +
        "_" +
        role;


    localStorage.setItem(
        resultKey,
        JSON.stringify({

            student:
                currentUser.name,

            email:
                currentUser.email,

            company:
                company,

            role:
                role,

            score:
                score,

            total:
                questions.length,

            percentage:
                percentage,

            correct:
                score,

            wrong:
                wrongAnswers,

            unanswered:
                unanswered,

            date:
                new Date().toLocaleString()

        })
    );


    // ======================================
    // SAVE RESULT TO BACKEND
    // ======================================

    try {

        const perfEndpoint = window.getApiUrl ? window.getApiUrl("/api/performance") : "/api/performance";
        const response =
            await fetch(
                perfEndpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            email:
                                currentUser.email,

                            type:
                                "Company Quiz",

                            company:
                                company,

                            role:
                                role,

                            score:
                                score,

                            percentage:
                                percentage,

                            correct:
                                score,

                            wrong:
                                wrongAnswers,

                            unanswered:
                                unanswered

                        })

                }
            );


        const data =
            await response.json();


        if (response.ok) {

            console.log(
                "Company quiz performance saved:",
                data
            );

        }

        else {

            console.log(
                "Performance save failed:",
                data
            );

        }


    } catch (error) {

        console.log(
            "Unable to save performance:",
            error
        );

    }

}


// ==========================================
// RETAKE QUIZ
// ==========================================

function retakeQuiz() {

    window.location.href =
        "company-quiz.html?company=" +
        encodeURIComponent(
            company
        ) +
        "&role=" +
        encodeURIComponent(
            role
        );

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// BACK TO PREPARATION
// ==========================================

function goPreparation() {

    window.location.href =
        "preparation.html?company=" +
        encodeURIComponent(
            company
        ) +
        "&role=" +
        encodeURIComponent(
            role
        );

}



// ==========================================
// DASHBOARD
// ==========================================

function goDashboard() {

    window.location.href =
        "dashboard.html";

}



// ==========================================
// START
// ==========================================

loadQuestions();

</script>

</body>

</html>
