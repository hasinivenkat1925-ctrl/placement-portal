<!DOCTYPE html>
<html>

<head>
    <title>Placement Questions</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #1f2937;
        }

        .question-box {
            background: white;
            margin-bottom: 25px;
            padding: 22px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
        }

        .question-box h3 {
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .answer-box {
            background: #ecfdf5;
            color: #065f46;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 12px;
            border: 1px solid #a7f3d0;
        }

        .explanation-box {
            background: #eff6ff;
            color: #1e40af;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            line-height: 1.6;
            font-size: 15px;
            margin-top: 10px;
        }

        .option {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>📝 Previous Year Placement Questions</h1>

    <h2 id="companyTitle"></h2>
    <h3 id="roleTitle"></h3>

    <hr>

    <div id="questions">
        <p>Loading questions...</p>
    </div>

    <br>

    <button onclick="goBack()">
        ← Back to Preparation
    </button>

    <button onclick="goDashboard()">
        🏠 Dashboard
    </button>


<script>

/* ==========================================
   GET COMPANY AND ROLE
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const company =
    params.get("company") ||
    localStorage.getItem("selectedCompany") ||
    "Company";

const role =
    params.get("role") ||
    localStorage.getItem("selectedRole") ||
    "Role";


/* ==========================================
   DISPLAY COMPANY AND ROLE
========================================== */

document.getElementById(
    "companyTitle"
).innerText =
    "🏢 Company: " + company;

document.getElementById(
    "roleTitle"
).innerText =
    "💼 Role: " + role;


/* ==========================================
   LOAD QUESTIONS
========================================== */

/* ==========================================
   LOAD AI COMPANY QUESTIONS
========================================== */

async function loadQuestions() {

    const container =
        document.getElementById("questions");

    try {

        container.innerHTML =
            "<h3>🤖 Generating AI questions...</h3>" +
            "<p>Please wait...</p>";

        const response =
            await fetch(
                "/api/generate-company-questions?company=" +
                encodeURIComponent(company) +
                "&role=" +
                encodeURIComponent(role)
            );

        if (!response.ok) {
            throw new Error(
                "Unable to generate AI questions"
            );
        }

        const data =
            await response.json();

        const questions =
            data.questions || [];

        if (questions.length === 0) {
            throw new Error(
                "No AI questions generated"
            );
        }

        container.innerHTML = "";

        const total =
            document.createElement("h3");

        total.innerText =
            "🤖 AI Questions: " +
            questions.length;

        container.appendChild(total);

        const info =
            document.createElement("p");

        info.innerHTML =
            "📚 AI-generated placement questions for " +
            "<strong>" +
            company +
            " - " +
            role +
            "</strong>";

        container.appendChild(info);

        const line =
            document.createElement("hr");

        container.appendChild(line);


        questions.forEach(
            (item, index) => {

                const box =
                    document.createElement("div");

                box.className =
                    "question-box";


                const heading =
                    document.createElement("h3");

                heading.innerText =
                    (index + 1) +
                    ". " +
                    item.question;

                box.appendChild(heading);


                const answer =
                    document.createElement("div");

                answer.className = "answer-box";

                answer.innerHTML =
                    "✅ <strong>Answer:</strong> " +
                    item.answer;

                box.appendChild(answer);


                const expText = item.explanation || item.solution || ("This question was previously asked in " + company + " placement drive for the " + role + " position to evaluate core domain concepts and technical competence.");

                const explanation =
                    document.createElement("div");

                explanation.className = "explanation-box";

                explanation.innerHTML =
                    "💡 <strong>Explanation:</strong> " +
                    expText;

                box.appendChild(explanation);

                container.appendChild(box);

            }
        );

    }

    catch (error) {
        console.warn("Backend unavailable, loading local questions.json fallback:", error);
        try {
            const staticRes = await fetch("questions.json");
            const staticQuestions = await staticRes.json();
            const filtered = staticQuestions.filter(q => 
                (q.company && q.company.toLowerCase() === company.toLowerCase()) ||
                (q.role && q.role.toLowerCase() === role.toLowerCase())
            );
            const list = filtered.length > 0 ? filtered : staticQuestions.slice(0, 10);
            
            container.innerHTML = "";
            const total = document.createElement("h3");
            total.innerText = "📚 Questions: " + list.length;
            container.appendChild(total);

            const info = document.createElement("p");
            info.innerHTML = "Practice placement questions for <strong>" + company + " - " + role + "</strong>";
            container.appendChild(info);
            container.appendChild(document.createElement("hr"));

            list.forEach((item, index) => {
                const box = document.createElement("div");
                box.className = "question-box";

                const heading = document.createElement("h3");
                heading.innerText = (index + 1) + ". " + item.question;
                box.appendChild(heading);

                const answer = document.createElement("div");
                answer.className = "answer-box";
                answer.innerHTML = "✅ <strong>Answer:</strong> " + item.answer;
                box.appendChild(answer);

                const expText = item.explanation || item.solution || ("This question was previously asked in " + company + " placement drive for the " + role + " position to evaluate core domain concepts and technical competence.");

                const explanation = document.createElement("div");
                explanation.className = "explanation-box";
                explanation.innerHTML = "💡 <strong>Explanation:</strong> " + expText;
                box.appendChild(explanation);

                container.appendChild(box);
            });
        } catch (e) {
            container.innerHTML = `
                <h3>❌ Unable to load questions</h3>
                <p>Please make sure you have internet access.</p>
            `;
        }
    }
}

/* ==========================================
   BACK
========================================== */

function goBack() {

    window.location.href =
        "preparation.html?company=" +
        encodeURIComponent(company) +
        "&role=" +
        encodeURIComponent(role);
}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "dashboard.html";
}


/* ==========================================
   START
========================================== */

loadQuestions();

</script>

</body>

</html>
