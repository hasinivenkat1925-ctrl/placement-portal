<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Portal Access - Placement Preparation Portal</title>
    <link rel="stylesheet" href="CSS/style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #030712 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #111827;
            border: 1px solid #1f293d;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.15);
            text-align: center;
        }

        h1 {
            color: #f8fafc;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 40px;
        }

        .login-container {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .login-card {
            flex: 1;
            max-width: 400px;
            min-height: 280px;
            border: 1px solid #1f293d;
            border-radius: 16px;
            padding: 35px 25px;
            background: #1e293b;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 14px;
        }

        .login-card h2 {
            color: #f8fafc;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #2563eb;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }

        .admin-btn {
            background: #10b981;
        }

        .admin-btn:hover {
            background: #059669;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        .back-btn {
            margin-top: 35px;
            background: transparent;
            border: none;
            color: #3b82f6;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            text-decoration: underline;
            color: #60a5fa;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }

            .login-container {
                flex-direction: column;
                align-items: center;
            }

            .login-card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to Placement Portal</h1>

        <p class="subtitle">
            Please select your portal login type to continue
        </p>


        <div class="login-container">

            <!-- Student Login -->
            <div class="login-card">
                <div>
                    <div class="icon">👨‍🎓</div>
                    <h2>Student Portal</h2>
                    <p>
                        Access company PYQs, topic quizzes, notes, and mock interview practice.
                    </p>
                </div>
                <button class="login-btn" onclick="studentLogin()">
                    👨‍🎓 Student Login
                </button>
            </div>


            <!-- Admin Login -->
            <div class="login-card">
                <div>
                    <div class="icon">👨‍💼</div>
                    <h2>Admin Portal</h2>
                    <p>
                        Manage company roles, question sets, student profiles, and analytics.
                    </p>
                </div>
                <button class="login-btn admin-btn" onclick="adminLogin()">
                    👨‍💼 Admin Login
                </button>
            </div>

        </div>


        <button class="back-btn" onclick="goBack()">
            ← Back to Introduction
        </button>


        <div class="footer">
            Placement Preparation Portal
        </div>

    </div>


    <script>
        function studentLogin() {
            window.location.href = "login.html";
        }

        function adminLogin() {
            window.location.href = "admin-login.html";
        }

        function goBack() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
